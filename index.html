<style>
/* ===== DESIGN TOKENS ===== */
:root{
  --bg:#f2f4f8;
  --bg-elevated:#ffffff;
  --bg-soft:#eef1f7;
  --text:#171a24;
  --text-dim:#6b7280;
  --border:#e3e6ee;
  --primary:#2451e8;
  --primary-soft:#e8edfd;
  --success:#16a34a;
  --success-bg:#e7f7ec;
  --danger:#dc2626;
  --danger-bg:#fdecec;
  --warning:#d97706;
  --warning-bg:#fef3e0;
  --shadow:0 2px 10px rgba(20,25,40,0.06);

  --radius-card:12px;
  --radius-control:12px;
  --pad-card:16px;
  --control-h:46px;
  --icon-box:40px;
  --icon-size:20px;

  --fs-title:19px;
  --fs-card-title:14px;
  --fs-body:15px;
  --fs-amount:16px;
  --fs-meta:12.5px;
}

@media (prefers-color-scheme: dark){
  :root{
    --bg:#0b1220;
    --bg-elevated:#161f33;
    --bg-soft:#1d2740;
    --text:#eef1f8;
    --text-dim:#9aa4b8;
    --border:#26314c;
    --shadow:0 2px 12px rgba(0,0,0,0.35);
    --primary-soft:#1b2748;
    --success-bg:#0f2b1c;
    --danger-bg:#331414;
    --warning-bg:#332507;
  }
}

html[data-theme="light"]{
  --bg:#f2f4f8;
  --bg-elevated:#ffffff;
  --bg-soft:#eef1f7;
  --text:#171a24;
  --text-dim:#6b7280;
  --border:#e3e6ee;
  --shadow:0 2px 10px rgba(20,25,40,0.06);
  --primary-soft:#e8edfd;
  --success-bg:#e7f7ec;
  --danger-bg:#fdecec;
  --warning-bg:#fef3e0;
}

html[data-theme="dark"]{
  --bg:#0b1220;
  --bg-elevated:#161f33;
  --bg-soft:#1d2740;
  --text:#eef1f8;
  --text-dim:#9aa4b8;
  --border:#26314c;
  --shadow:0 2px 12px rgba(0,0,0,0.35);
  --primary-soft:#1b2748;
  --success-bg:#0f2b1c;
  --danger-bg:#331414;
  --warning-bg:#332507;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  height:100%;
  background:var(--bg);
}

body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color:var(--text);
  font-size:var(--fs-body);
  overscroll-behavior-y:none;
}

button,input,select,textarea{
  font-family:inherit;
  color:inherit;
}

h1,h2,h3,p{
  margin:0;
}

/* ===== LAYOUT ===== */
#app{
  display:flex;
  flex-direction:column;
  min-height:100%;
  padding-bottom:calc(74px + env(safe-area-inset-bottom));
}

.topbar{
  position:sticky;
  top:0;
  z-index:20;
  background:var(--bg);
  padding:calc(14px + env(safe-area-inset-top)) 16px 10px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid var(--border);
}

.topbar h1{
  font-size:var(--fs-title);
  font-weight:700;
}

main{
  flex:1;
  padding:14px 14px 24px;
}

.view{
  display:none;
  animation:fadein .18s ease;
}

.view.active{
  display:block;
}

@keyframes fadein{
  from{opacity:0;transform:translateY(4px);}
  to{opacity:1;transform:translateY(0);}
}

/* ===== CARD SYSTEM ===== */
.card,
.stat-box,
.debt-card{
  background:var(--bg-elevated);
  border-radius:var(--radius-card);
  box-shadow:var(--shadow);
  padding:var(--pad-card);
}

.card{
  margin-bottom:14px;
}

.card h3,
.card-title{
  font-size:var(--fs-card-title);
  font-weight:700;
  color:var(--text-dim);
  margin-bottom:12px;
}

/* ===== ICON SYSTEM ===== */
.icon-box{
  width:var(--icon-box);
  height:var(--icon-box);
  min-width:var(--icon-box);
  border-radius:10px;
  background:var(--bg-soft);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:var(--icon-size);
  line-height:1;
}

.icon-box.action{
  background:var(--bg-soft);
  border:none;
  color:var(--text-dim);
}

.icon-box.action:active{
  background:var(--border);
}

.icon-box.danger-tone{
  background:var(--danger-bg);
  color:var(--danger);
}

/* ===== STAT GRID ===== */
.stat-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.stat-box .label{
  font-size:var(--fs-meta);
  color:var(--text-dim);
  margin-bottom:6px;
}

.stat-box .value{
  font-size:var(--fs-amount);
  font-weight:700;
  line-height:1.25;
}

.stat-box.hero{
  grid-column:1/-1;
}

.stat-box.hero .value{
  font-size:21px;
}

.stat-box.full{
  grid-column:1/-1;
}

.stat-box.warn{
  background:var(--danger-bg);
}

.stat-box.warn .value{
  color:var(--danger);
}

.pos{
  color:var(--success);
}

.neg{
  color:var(--danger);
}

.chart-wrap{
  position:relative;
  height:220px;
}

/* ===== TABS / SEGMENTED ===== */
.tabs{
  display:flex;
  gap:8px;
  margin-bottom:12px;
  overflow-x:auto;
}

.tabs button{
  flex:1;
  height:var(--control-h);
  padding:0 10px;
  border-radius:999px;
  border:1px solid var(--border);
  background:var(--bg-elevated);
  color:var(--text-dim);
  font-size:13px;
  font-weight:700;
  white-space:nowrap;
}

.tabs button.active{
  background:var(--primary);
  color:#fff;
  border-color:var(--primary);
}

.segmented{
  display:flex;
  border-radius:var(--radius-control);
  overflow:hidden;
  border:1px solid var(--border);
}

.segmented button{
  flex:1;
  height:var(--control-h);
  background:var(--bg-soft);
  border:none;
  color:var(--text-dim);
  font-weight:700;
  font-size:14px;
}

.segmented button.active{
  background:var(--primary);
  color:#fff;
}

/* ===== FORM CONTROLS ===== */
.search-row{
  display:flex;
  gap:8px;
  margin-bottom:10px;
}

.search-row input[type="text"]{
  flex:1;
}

input[type="text"],
input[type="number"],
input[type="date"],
input[type="tel"],
select,
textarea{
  width:100%;
  height:var(--control-h);
  padding:0 13px;
  border-radius:var(--radius-control);
  border:1px solid var(--border);
  background:var(--bg-soft);
  color:var(--text);
  font-size:var(--fs-body);
}

textarea{
  height:auto;
  padding:11px 13px;
  resize:vertical;
  min-height:64px;
}

label{
  font-size:var(--fs-meta);
  color:var(--text-dim);
  display:block;
  margin:14px 0 6px;
  font-weight:700;
}

.form-row{
  display:flex;
  gap:10px;
}

.form-row > div{
  flex:1;
}

.date-filter{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:10px;
}

.date-filter select{
  flex:1;
  min-width:120px;
}

.custom-range{
  display:none;
  gap:8px;
  margin-bottom:10px;
}

.custom-range.show{
  display:flex;
}

/* ===== TRANSACTION LIST ===== */
.txn-item{
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px 0;
  border-bottom:1px solid var(--border);
}

.txn-item:last-child{
  border-bottom:none;
}

.txn-info{
  flex:1;
  min-width:0;
}

.txn-info .cat{
  font-weight:700;
  font-size:var(--fs-body);
}

.txn-info .meta{
  font-size:var(--fs-meta);
  color:var(--text-dim);
  margin-top:2px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.txn-amount{
  text-align:right;
  font-weight:700;
  font-size:var(--fs-amount);
  white-space:nowrap;
}

.txn-actions{
  display:flex;
  gap:6px;
  margin-left:4px;
  flex-shrink:0;
}

/* =========================================================
   ===== DEBT CARD — ACCORDION =============================
   ========================================================= */

.debt-list{
  display:flex;
  flex-direction:column;
  gap:10px;
}

/* Thẻ khoản nợ */
.debt-card{
  margin:0;
  padding:0;
  overflow:hidden;
  transition:
    box-shadow .18s ease,
    transform .12s ease;
}

/* Header luôn hiển thị */
.debt-summary{
  min-height:72px;
  padding:13px 12px 13px 14px;
  display:flex;
  align-items:center;
  gap:10px;
  cursor:pointer;
  user-select:none;
  -webkit-user-select:none;
}

.debt-summary:active{
  background:var(--bg-soft);
}

/* Icon */
.debt-summary-icon{
  width:38px;
  height:38px;
  min-width:38px;
  border-radius:11px;
  background:var(--primary-soft);
  color:var(--primary);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:19px;
}

/* Khối tên + tiến độ */
.debt-summary-main{
  flex:1;
  min-width:0;
  display:flex;
  flex-direction:column;
  justify-content:center;
  gap:6px;
}

.debt-summary-name-row{
  display:flex;
  align-items:center;
  gap:7px;
  min-width:0;
}

.debt-summary .name{
  font-size:15px;
  font-weight:700;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.debt-summary .status-badge{
  flex-shrink:0;
  font-size:10px;
  line-height:1;
  padding:4px 7px;
  border-radius:999px;
  background:var(--success-bg);
  color:var(--success);
  font-weight:700;
}

.debt-summary-progress{
  display:flex;
  align-items:center;
  gap:7px;
}

.debt-summary-progress .progress-track{
  flex:1;
  margin:0;
  height:6px;
  min-width:45px;
}

.debt-summary-progress .progress-label{
  flex-shrink:0;
  font-size:11px;
  color:var(--text-dim);
  font-weight:700;
  min-width:38px;
}

/* Số tiền kỳ tới */
.debt-summary-next{
  min-width:102px;
  text-align:right;
  display:flex;
  flex-direction:column;
  align-items:flex-end;
  gap:3px;
}

.debt-summary-next .label{
  font-size:10px;
  color:var(--text-dim);
  line-height:1.1;
}

.debt-summary-next .amount{
  font-size:14px;
  font-weight:800;
  color:var(--text);
  white-space:nowrap;
}

/* Mũi tên */
.debt-chevron{
  width:30px;
  height:30px;
  min-width:30px;
  border-radius:9px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--text-dim);
  font-size:17px;
  transition:
    transform .2s ease,
    background .15s ease;
}

.debt-card.expanded .debt-chevron{
  transform:rotate(180deg);
  background:var(--bg-soft);
  color:var(--primary);
}

/* Phần chi tiết */
.debt-details{
  display:none;
  padding:0 14px 14px;
  border-top:1px solid var(--border);
}

.debt-card.expanded .debt-details{
  display:block;
  animation:debtOpen .18s ease;
}

@keyframes debtOpen{
  from{
    opacity:0;
    transform:translateY(-4px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

.debt-detail-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:0 14px;
}

.debt-detail-grid .row{
  min-height:43px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  gap:3px;
  border-bottom:1px solid var(--border);
}

.debt-detail-grid .row span{
  font-size:11px;
  color:var(--text-dim);
}

.debt-detail-grid .row b{
  color:var(--text);
  font-size:13.5px;
  font-weight:700;
}

.debt-detail-grid .row.full{
  grid-column:1/-1;
}

/* Tiến độ lớn trong phần mở */
.debt-detail-progress{
  padding-top:13px;
}

.debt-detail-progress-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:6px;
  font-size:11px;
  color:var(--text-dim);
}

.debt-detail-progress-top b{
  color:var(--text);
  font-size:12px;
}

.debt-details .progress-track{
  background:var(--bg-soft);
  border-radius:999px;
  height:8px;
  overflow:hidden;
  margin-top:0;
}

.debt-details .progress-fill{
  height:100%;
  background:var(--primary);
  border-radius:999px;
  transition:width .3s;
}

.debt-details .progress-fill.warn{
  background:var(--warning);
}

.debt-details .progress-fill.danger{
  background:var(--danger);
}

/* Dãy kỳ thanh toán */
.installment-section{
  padding-top:14px;
}

.installment-section-title{
  font-size:12px;
  color:var(--text-dim);
  font-weight:700;
  margin-bottom:8px;
}

.installment-grid{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
}

.installment-chip{
  min-width:39px;
  height:34px;
  padding:0 9px;
  border-radius:9px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:12px;
  font-weight:700;
  border:1px solid var(--border);
  background:var(--bg-soft);
  color:var(--text-dim);
}

button.installment-chip{
  cursor:pointer;
}

.installment-chip.paid{
  background:var(--success-bg);
  color:var(--success);
  border-color:transparent;
}

.installment-chip.due{
  background:var(--primary);
  color:#fff;
  border-color:transparent;
}

.installment-chip.locked{
  opacity:.45;
}

/* Các nút hành động */
.debt-actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:14px;
}

.debt-actions .btn{
  width:100%;
  margin:0;
}

.debt-actions .btn:last-child:nth-child(odd){
  grid-column:1/-1;
}

/* ===== BUTTONS ===== */
.btn{
  height:var(--control-h);
  padding:0 14px;
  border-radius:var(--radius-control);
  border:none;
  font-weight:700;
  font-size:14px;
  background:var(--primary);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.btn.secondary{
  background:var(--bg-soft);
  color:var(--text);
}

.btn.danger{
  background:var(--danger-bg);
  color:var(--danger);
}

.btn.success{
  background:var(--success-bg);
  color:var(--success);
}

.btn:disabled{
  opacity:.4;
}

.btn.block{
  width:100%;
  margin-top:14px;
}

/* ===== BUDGET ===== */
.budget-row{
  margin-bottom:18px;
}

.budget-row:last-child{
  margin-bottom:0;
}

.budget-row .top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:var(--fs-body);
  margin-bottom:6px;
  gap:10px;
}

.budget-row .top .name{
  font-weight:700;
  display:flex;
  align-items:center;
  gap:10px;
}

.budget-row .top .amounts{
  color:var(--text-dim);
  font-size:var(--fs-meta);
  text-align:right;
  white-space:nowrap;
}

.budget-row input{
  margin-top:8px;
}

/* ===== RECURRING ===== */
.recurring-item{
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px 0;
  border-bottom:1px solid var(--border);
}

.recurring-item:last-child{
  border-bottom:none;
}

.recurring-item .info{
  flex:1;
  min-width:0;
}

.recurring-item .info .t{
  font-weight:700;
  font-size:var(--fs-body);
}

.recurring-item .info .m{
  font-size:var(--fs-meta);
  color:var(--text-dim);
  margin-top:2px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

/* ===== SETTINGS ===== */
.settings-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:13px 0;
  border-bottom:1px solid var(--border);
}

.settings-row:last-child{
  border-bottom:none;
}

.settings-row .t{
  font-weight:700;
  font-size:var(--fs-body);
}

.settings-row .s{
  font-size:var(--fs-meta);
  color:var(--text-dim);
  margin-top:2px;
}

.switch{
  position:relative;
  width:48px;
  height:28px;
  flex-shrink:0;
}

.switch input{
  opacity:0;
  width:0;
  height:0;
}

.switch .slider{
  position:absolute;
  inset:0;
  background:var(--border);
  border-radius:999px;
  transition:.2s;
}

.switch .slider:before{
  content:"";
  position:absolute;
  width:22px;
  height:22px;
  left:3px;
  top:3px;
  background:#fff;
  border-radius:50%;
  transition:.2s;
}

.switch input:checked + .slider{
  background:var(--primary);
}

.switch input:checked + .slider:before{
  transform:translateX(20px);
}

.empty-state{
  text-align:center;
  padding:36px 10px;
  color:var(--text-dim);
  font-size:var(--fs-body);
}

.empty-state .icon-box{
  margin:0 auto 12px;
  width:52px;
  height:52px;
  font-size:24px;
  border-radius:14px;
}

/* ===== FAB ===== */
.fab{
  position:fixed;
  right:18px;
  bottom:calc(88px + env(safe-area-inset-bottom));
  width:56px;
  height:56px;
  border-radius:16px;
  background:var(--primary);
  color:#fff;
  font-size:26px;
  border:none;
  box-shadow:0 6px 16px rgba(36,81,232,0.4);
  z-index:30;
  display:flex;
  align-items:center;
  justify-content:center;
  line-height:1;
}

.fab.hidden{
  display:none;
}

/* ===== BOTTOM NAV ===== */
.bottomnav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:25;
  background:var(--bg-elevated);
  border-top:1px solid var(--border);
  display:flex;
  padding:6px 6px calc(6px + env(safe-area-inset-bottom));
}

.bottomnav button{
  flex:1;
  background:none;
  border:none;
  padding:2px 2px;
  color:var(--text-dim);
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:2px;

/* ===================== HELPERS ===================== */

function uid(){
  return Date.now().toString(36) + Math.random().toString(36).slice(2,9);
}

function toNumber(v){
  var n = Number(v);
  return isNaN(n) ? 0 : n;
}

function pad2(n){
  return n < 10 ? '0'+n : ''+n;
}

function todayStr(){
  var d = new Date();
  return d.getFullYear() + '-' +
    pad2(d.getMonth()+1) + '-' +
    pad2(d.getDate());
}

function monthKeyOf(dateStr){
  return dateStr.slice(0,7);
}

function currentMonthKey(){
  return monthKeyOf(todayStr());
}

function lastMonthKey(){
  var d = new Date();
  d.setDate(1);
  d.setMonth(d.getMonth()-1);

  return d.getFullYear() + '-' +
    pad2(d.getMonth()+1);
}

function formatMoney(n){
  n = Math.round(toNumber(n));
  return n.toLocaleString('vi-VN') + ' ₫';
}

function formatDateDisplay(dateStr){
  var p = dateStr.split('-');

  if (p.length !== 3) return dateStr;

  return p[2] + '/' + p[1] + '/' + p[0];
}

function monthLabel(mk){
  var p = mk.split('-');
  return 'Th' + toNumber(p[1]) + '/' + p[0];
}

function escapeHtml(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;');
}

function escapeAttr(s){
  return escapeHtml(s).replace(/"/g,'&quot;');
}


/* ===================== STORAGE ===================== */

function loadState(){

  try{
    var t = localStorage.getItem('ptm_transactions');
    state.transactions = t ? JSON.parse(t) : [];
  }catch(e){
    state.transactions = [];
  }

  try{
    var d = localStorage.getItem('ptm_debts');
    state.debts = d ? JSON.parse(d) : [];
  }catch(e){
    state.debts = [];
  }

  try{
    var b = localStorage.getItem('ptm_budgets');
    state.budgets = b ? JSON.parse(b) : {};
  }catch(e){
    state.budgets = {};
  }

  try{
    var r = localStorage.getItem('ptm_recurring');
    state.recurring = r ? JSON.parse(r) : [];
  }catch(e){
    state.recurring = [];
  }

  try{
    var s = localStorage.getItem('ptm_settings');
    state.settings = s ? JSON.parse(s) : {
      theme:'auto',
      pinEnabled:false,
      pin:''
    };
  }catch(e){
    state.settings = {
      theme:'auto',
      pinEnabled:false,
      pin:''
    };
  }

  for (var i=0;i<state.transactions.length;i++){
    state.transactions[i].amount =
      toNumber(state.transactions[i].amount);
  }

  for (var j=0;j<state.debts.length;j++){

    var d2 = state.debts[j];

    d2.totalAmount = toNumber(d2.totalAmount);
    d2.months = toNumber(d2.months);
    d2.interestRate = toNumber(d2.interestRate || 0);
    d2.totalInterest = toNumber(d2.totalInterest || 0);

    if (!Array.isArray(d2.paidHistory)){

      d2.paidHistory = [];

      if (Array.isArray(d2.history)){

        var oldMonthly =
          toNumber(d2.monthlyAmount) ||
          (d2.totalAmount / (d2.months || 1));

        for (var h=0;h<d2.history.length;h++){

          var old = d2.history[h];

          d2.paidHistory.push({
            month:old.month,
            principal:oldMonthly,
            interest:0,
            amount:toNumber(old.amount) || oldMonthly,
            paidAt:old.date || todayStr()
          });
        }
      }

      delete d2.monthlyAmount;
      delete d2.paidMonths;
      delete d2.remaining;
      delete d2.lastPaidMonth;
      delete d2.history;
    }

    if (!d2.status){
      d2.status = 'active';
    }
  }

  for (var cat in state.budgets){
    state.budgets[cat] = toNumber(state.budgets[cat]);
  }

  for (var k=0;k<state.recurring.length;k++){
    state.recurring[k].amount =
      toNumber(state.recurring[k].amount);
  }
}

/* ===================== PWA ===================== */

function generateIcon(size){

  var canvas = document.createElement('canvas');

  canvas.width = size;
  canvas.height = size;

  var ctx = canvas.getContext('2d');

  var grad = ctx.createLinearGradient(0,0,size,size);

  grad.addColorStop(0,'#4f7cff');
  grad.addColorStop(1,'#1c3fc7');

  roundRectPath(
    ctx,
    0,
    0,
    size,
    size,
    size*0.22
  );

  ctx.fillStyle = grad;
  ctx.fill();

  ctx.fillStyle = '#ffffff';

  ctx.font =
    'bold ' +
    Math.floor(size*0.52) +
    'px -apple-system, sans-serif';

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  ctx.fillText(
    '₫',
    size/2,
    size/2 + size*0.04
  );

  return canvas.toDataURL('image/png');
}

function roundRectPath(ctx,x,y,w,h,r){

  ctx.beginPath();

  ctx.moveTo(x+r,y);

  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);

  ctx.closePath();
}

function setupPWA(){

  try{

}

function registerSW(){

  if (!('serviceWorker' in navigator)) return;

  try{

    var swCode = [

      "var CACHE_NAME='thuchi-cache-v1';",

      "self.addEventListener('install', function(event){",

      "  self.skipWaiting();",

      "  event.waitUntil(caches.open(CACHE_NAME).then(function(cache){",

      "    return cache.addAll(['./']).catch(function(){});",

      "  }));",

      "});",

      "self.addEventListener('activate', function(event){",

      "  event.waitUntil(self.clients.claim());",

      "});",

      "self.addEventListener('fetch', function(event){",

      "  event.respondWith(",

      "    caches.match(event.request).then(function(cached){",

      "      if (cached) return cached;",

      "      return fetch(event.request).then(function(res){",

      "        return caches.open(CACHE_NAME).then(function(cache){",

      "          try{ cache.put(event.request,res.clone()); }catch(e){}",

      "          return res;",

      "        });",

      "      }).catch(function(){ return caches.match('./'); });",

      "    })",

      "  );",

      "});"

    ].join('\n');

    var blob = new Blob(
      [swCode],
      {type:'application/javascript'}
    );

    var swUrl = URL.createObjectURL(blob);

    navigator.serviceWorker
      .register(swUrl)
      .catch(function(){});

  }catch(e){}
}

function applyTheme(){

/* ===================== STANDALONE NAVIGATION ===================== */

function preventExternalNavigation(){

  var isStandalone =
    (window.navigator.standalone === true) ||
    (
      window.matchMedia &&
      window.matchMedia('(display-mode: standalone)').matches
    );

  if (!isStandalone) return;

  document.addEventListener(
    'click',
    function(e){

      var a = e.target.closest('a[href]');

      if (!a) return;

      var href = a.getAttribute('href');

      if (
        !href ||
        href.charAt(0)==='#' ||
        href.indexOf('data:')===0 ||
        href.indexOf('blob:')===0
      ){
        return;
      }

      try{

        var url =
          new URL(href,window.location.href);

        if (url.origin === window.location.origin){

          e.preventDefault();

          window.location.href = url.href;

        }else{

          e.preventDefault();

          window.open(url.href,'_blank');
        }

      }catch(err){}

    },
    true
  );
}
